name: QA

on:
  push:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas requests garminconnect==0.3.2 plotly streamlit pytest ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check . --exclude docs

      - name: Run pytest
        run: pytest -p no:cacheprovider -q